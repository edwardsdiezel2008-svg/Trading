<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal Calendar</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e2e2e6;
    --text: #1c1c1f;
    --muted: #6b6b74;
    --accent: #4f5fe0;
    --accent-weak: #eceeff;
    --done: #1f9d55;
    --today-ring: #e0524f;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171b;
      --panel: #212127;
      --border: #34343c;
      --text: #ececf0;
      --muted: #9a9aa5;
      --accent: #8b93ff;
      --accent-weak: #2a2c4e;
      --done: #45c07a;
      --today-ring: #ff6f6b;
      --shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
  }
  .app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }
  header.bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  header.bar h1 {
    font-size: 20px;
    margin: 0;
    font-weight: 650;
  }
  .nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 12px;
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .month-label {
    font-weight: 600;
    min-width: 150px;
    text-align: center;
  }
  .status {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--done);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--done) 25%, transparent);
  }
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }
  .grid {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .dow-row, .week-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .dow-row div {
    padding: 10px 6px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  .day {
    min-height: 84px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 6px 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    cursor: default;
    position: relative;
  }
  .week-row .day:last-child { border-right: none; }
  .day.pad { background: color-mix(in srgb, var(--bg) 60%, var(--panel)); }
  .day .num {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .day.has-entry { cursor: pointer; }
  .day.has-entry:hover { background: var(--accent-weak); }
  .day.today .num span:first-child {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--today-ring);
    color: white;
    font-weight: 700;
  }
  .day.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
  .day .title {
    font-size: 11.5px;
    color: var(--text);
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .day .progress-wrap {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .day .progress-bar {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    overflow: hidden;
  }
  .day .progress-bar > i {
    display: block;
    height: 100%;
    background: var(--done);
  }
  .day .count {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
  }
  aside.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 16px;
    position: sticky;
    top: 16px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
  }
  aside.panel h2 {
    font-size: 15px;
    margin: 0 0 2px;
  }
  aside.panel .date-sub {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  aside.panel .empty {
    color: var(--muted);
    font-size: 13px;
  }
  ul.tasks {
    list-style: none;
    margin: 0 0 16px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  ul.tasks li {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 13px;
    line-height: 1.4;
  }
  ul.tasks li .box {
    flex: 0 0 auto;
    width: 15px;
    height: 15px;
    border-radius: 4px;
    border: 1.5px solid var(--border);
    margin-top: 1px;
  }
  ul.tasks li.done .box {
    background: var(--done);
    border-color: var(--done);
  }
  ul.tasks li.done span.txt {
    color: var(--muted);
    text-decoration: line-through;
  }
  .notes-body {
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
    color: var(--text);
  }
  .notes-body a { color: var(--accent); }
  h3.section {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 8px;
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>Journal Calendar</h1>
    <div class="status"><span class="live-dot"></span><span id="statusText">loading…</span></div>
  </header>

  <div class="nav" style="margin-bottom: 14px;">
    <button id="prevBtn">&larr;</button>
    <div class="month-label" id="monthLabel">-</div>
    <button id="nextBtn">&rarr;</button>
    <button id="todayBtn" class="primary">Today</button>
  </div>

  <div class="layout">
    <div class="grid">
      <div class="dow-row">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div id="weeks"></div>
    </div>

    <aside class="panel" id="panel">
      <div class="empty">Click a day with entries to see its tasks and notes.</div>
    </aside>
  </div>
</div>

<script>
(function () {
  var data = { days: {} };
  var view = new Date();
  view.setDate(1);
  var selected = null;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function dateStr(y, m, d) { return y + "-" + pad(m + 1) + "-" + pad(d); }
  function todayStr() {
    var t = new Date();
    return dateStr(t.getFullYear(), t.getMonth(), t.getDate());
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function linkify(text) {
    var esc = escapeHtml(text);
    return esc.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }

  function render() {
    var y = view.getFullYear(), m = view.getMonth();
    document.getElementById("monthLabel").textContent =
      view.toLocaleString(undefined, { month: "long", year: "numeric" });

    var first = new Date(y, m, 1);
    var startOffset = first.getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var today = todayStr();

    var cells = [];
    for (var i = 0; i < startOffset; i++) cells.push(null);
    for (var d = 1; d <= daysInMonth; d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push(null);

    var html = "";
    for (var w = 0; w < cells.length / 7; w++) {
      html += '<div class="week-row">';
      for (var c = 0; c < 7; c++) {
        var dnum = cells[w * 7 + c];
        if (dnum === null) {
          html += '<div class="day pad"></div>';
          continue;
        }
        var ds = dateStr(y, m, dnum);
        var entry = data.days[ds];
        var classes = "day";
        if (entry) classes += " has-entry";
        if (ds === today) classes += " today";
        if (ds === selected) classes += " selected";

        html += '<div class="' + classes + '" data-date="' + ds + '">';
        html += '<div class="num"><span>' + dnum + '</span></div>';
        if (entry) {
          if (entry.title) {
            html += '<div class="title">' + escapeHtml(entry.title) + '</div>';
          }
          if (entry.task_count > 0) {
            var pct = Math.round((entry.done_count / entry.task_count) * 100);
            html += '<div class="progress-wrap"><div class="progress-bar"><i style="width:' + pct + '%"></i></div>' +
              '<span class="count">' + entry.done_count + '/' + entry.task_count + '</span></div>';
          }
        }
        html += '</div>';
      }
      html += '</div>';
    }
    document.getElementById("weeks").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll(".day.has-entry"), function (el) {
      el.addEventListener("click", function () {
        selected = el.getAttribute("data-date");
        render();
        renderPanel();
      });
    });
  }

  function renderPanel() {
    var panel = document.getElementById("panel");
    if (!selected || !data.days[selected]) {
      panel.innerHTML = '<div class="empty">Click a day with entries to see its tasks and notes.</div>';
      return;
    }
    var entry = data.days[selected];
    var dt = new Date(selected + "T00:00:00");
    var sub = dt.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });

    var html = "";
    html += "<h2>" + escapeHtml(entry.title || selected) + "</h2>";
    html += '<div class="date-sub">' + sub + "</div>";

    if (entry.tasks && entry.tasks.length) {
      html += '<h3 class="section">Tasks (' + entry.done_count + "/" + entry.task_count + ")</h3>";
      html += '<ul class="tasks">';
      entry.tasks.forEach(function (t) {
        html += '<li class="' + (t.done ? "done" : "") + '"><span class="box"></span><span class="txt">' +
          escapeHtml(t.text) + "</span></li>";
      });
      html += "</ul>";
    }

    if (entry.notes) {
      html += '<h3 class="section">Notes</h3>';
      html += '<div class="notes-body">' + linkify(entry.notes) + "</div>";
    }

    panel.innerHTML = html;
  }

  function setStatus(msg) {
    document.getElementById("statusText").textContent = msg;
  }

  var lastPayload = null;
  function poll() {
    fetch("index.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (json) {
        var raw = JSON.stringify(json);
        if (raw === lastPayload) {
          setStatus("live · up to date");
          return;
        }
        lastPayload = raw;
        data = json;
        setStatus("live · updated " + new Date(json.generated_at).toLocaleTimeString());
        render();
        renderPanel();
      })
      .catch(function () {
        setStatus("offline — run `python scripts/journal.py serve` and open this page from that server");
      });
  }

  document.getElementById("prevBtn").addEventListener("click", function () {
    view.setMonth(view.getMonth() - 1);
    render();
  });
  document.getElementById("nextBtn").addEventListener("click", function () {
    view.setMonth(view.getMonth() + 1);
    render();
  });
  document.getElementById("todayBtn").addEventListener("click", function () {
    var t = new Date();
    view = new Date(t.getFullYear(), t.getMonth(), 1);
    selected = todayStr();
    render();
    renderPanel();
  });

  render();
  poll();
  setInterval(poll, 4000);
})();
</script>
</body>
</html>
