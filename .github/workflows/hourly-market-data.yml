name: Hourly market data update

# Keeps paper_trading/ data fresh independent of any Claude session or MCP
# connector - runs on GitHub's own infrastructure on a schedule, so it
# doesn't matter whether anyone is chatting with Claude or has a device
# open. See scripts/fetch_market_data.py for the actual data fetch, which
# talks to Crypto.com's public REST API directly (no auth needed).
#
# Also deploys the rebuilt dashboard to GitHub Pages every run, so the
# dashboard itself needs no manual republish step from a Claude session -
# https://<owner>.github.io/<repo>/ always reflects the latest commit.
# (One-time manual setup required: repo Settings -> Pages -> Build and
# deployment -> Source: "GitHub Actions".)

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      site_ready: ${{ steps.stage.outputs.site_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/hello-rs2zvp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch fresh market data
        run: python scripts/fetch_market_data.py

      - name: Fetch futures data (real NQ=F/ES=F/YM=F/GC=F/RTY=F/CL=F, daily + 5-minute, free/no-auth Yahoo Finance source)
        run: |
          python scripts/fetch_index_futures.py || echo "WARN index futures fetch failed this run - continuing without fresh data"

      - name: Update BTC paper-trading state (daily + 15-min)
        run: |
          python scripts/paper_trade_update.py
          python scripts/paper_trade_update.py --suffix _15m --freq 15min --tracking-start "2026-08-08 08:45:00" --cost-aware-min-multiple 1.0

      - name: Update BTC Perpetual paper-trading state (3x leveraged, daily + 15-min)
        run: |
          python scripts/paper_trade_update.py --suffix _perp --symbol BTC_USDT --tracking-start "2026-08-10" --leverage 3.0 --bars-file paper_trading/bars.csv
          python scripts/paper_trade_update.py --suffix _perp_15m --symbol BTC_USDT --freq 15min --tracking-start "2026-08-08 08:45:00" --cost-aware-min-multiple 1.0 --leverage 3.0 --bars-file paper_trading/bars_15m.csv

      - name: Update ETH/SOL paper-trading state (daily)
        run: |
          python scripts/paper_trade_update.py --suffix _eth --symbol ETH_USDT --tracking-start "2026-08-09"
          python scripts/paper_trade_update.py --suffix _sol --symbol SOL_USDT --tracking-start "2026-08-09"

      - name: Update ETH/SOL Perpetual paper-trading state (3x leveraged)
        run: |
          python scripts/paper_trade_update.py --suffix _eth_perp --symbol ETH_USDT --tracking-start "2026-08-09" --leverage 3.0 --bars-file paper_trading/bars_eth.csv --funding-snapshot-file paper_trading/eth_market_snapshot.json
          python scripts/paper_trade_update.py --suffix _sol_perp --symbol SOL_USDT --tracking-start "2026-08-09" --leverage 3.0 --bars-file paper_trading/bars_sol.csv --funding-snapshot-file paper_trading/sol_market_snapshot.json

      - name: Update Index/Commodity Futures paper-trading state (real Yahoo Finance prices, Micro contract economics)
        run: |
          declare -A SYMS=( [nq]=MNQ [es]=MES [ym]=MYM [gc]=MGC [rty]=M2K [cl]=MCL )
          for suffix in nq es ym gc rty cl; do
            symbol=${SYMS[$suffix]}
            if [ -f "paper_trading/bars_${suffix}.csv" ]; then
              python scripts/paper_trade_update.py --suffix "_${suffix}" --symbol "$symbol" --tracking-start "2026-08-10" --bars-file "paper_trading/bars_${suffix}.csv"
            else
              echo "Skipping ${suffix} (daily) update - no bars_${suffix}.csv yet (first fetch hasn't succeeded)"
            fi
            if [ -f "paper_trading/bars_${suffix}5m.csv" ]; then
              python scripts/paper_trade_update.py --suffix "_${suffix}5m" --symbol "$symbol" --freq 5min --tracking-start "2026-08-10" --cost-aware-min-multiple 1.0 --bars-file "paper_trading/bars_${suffix}5m.csv"
            else
              echo "Skipping ${suffix} (5-min) update - no bars_${suffix}5m.csv yet (first fetch hasn't succeeded)"
            fi
          done

      - name: Update Nasdaq Futures extra timeframes (1-min, 15-min, 1-hour - NQ only)
        run: |
          if [ -f "paper_trading/bars_nq1m.csv" ]; then
            python scripts/paper_trade_update.py --suffix "_nq1m" --symbol MNQ --freq 1min --tracking-start "2026-08-11" --cost-aware-min-multiple 1.0 --bars-file "paper_trading/bars_nq1m.csv"
          else
            echo "Skipping nq1m update - no bars_nq1m.csv yet (first fetch hasn't succeeded)"
          fi
          if [ -f "paper_trading/bars_nq15m.csv" ]; then
            python scripts/paper_trade_update.py --suffix "_nq15m" --symbol MNQ --freq 15min --tracking-start "2026-08-11" --cost-aware-min-multiple 1.0 --bars-file "paper_trading/bars_nq15m.csv"
          else
            echo "Skipping nq15m update - no bars_nq15m.csv yet (first fetch hasn't succeeded)"
          fi
          if [ -f "paper_trading/bars_nq1h.csv" ]; then
            python scripts/paper_trade_update.py --suffix "_nq1h" --symbol MNQ --freq 1h --tracking-start "2026-08-11" --bars-file "paper_trading/bars_nq1h.csv"
          else
            echo "Skipping nq1h update - no bars_nq1h.csv yet (first fetch hasn't succeeded)"
          fi

      - name: Update memecoin scanners (precise + wide)
        run: |
          python scripts/memecoin_scan_update.py
          python scripts/memecoin_wide_scan.py

      - name: Fetch market news
        run: python scripts/fetch_news.py

      - name: Rebuild dashboard HTML
        run: python scripts/build_paper_trading_dashboard.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paper_trading/
          if git diff --cached --quiet; then
            echo "No changes - nothing to commit"
          else
            git commit -m "Automated market data update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin claude/hello-rs2zvp
            git push origin HEAD:claude/hello-rs2zvp
          fi

      - name: Stage dashboard for Pages
        id: stage
        run: |
          mkdir -p _site
          cp paper_trading/index.html _site/index.html
          cp paper_trading/dashboard.html _site/dashboard.html
          cp paper_trading/learn.html _site/learn.html
          cp paper_trading/notes.html _site/notes.html
          echo "site_ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    if: needs.update.outputs.site_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
